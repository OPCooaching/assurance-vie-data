repository: assurance-vie-data
privacy: public-anonymized

actors:
  chatgpt:
    read_all: true
    write_paths:
      - strategies/chatgpt/
      - history/chatgpt/
      - docs/data/chatgpt.json
      - docs/data/chatgpt-history.json
    may_read_other_strategy: true

  claude:
    read_all: true
    write_paths:
      - strategies/claude/
      - history/claude/
      - docs/data/claude.json
      - docs/claude.html
    may_read_other_strategy: true

  automation:
    read: true
    write_generated_market_data: true
    write_generated_dashboard_data: true

forbidden_data:
  - surname
  - email
  - postal_address
  - phone
  - birth_date_full
  - contract_number
  - client_identifier
  - raw_contract_document
  - exact_contract_value_in_repository
  - beneficiary_clause

allowed_identity:
  alias: Bernard

portfolio_representation:
  exact_euro_amounts_in_repository: false
  percentages: true
  base_100: true
  exact_value_on_public_page_via_secret: true
