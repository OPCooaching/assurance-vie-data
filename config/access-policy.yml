repository: assurance-vie-data
privacy: public-anonymized

actors:
  chatgpt:
    read_all: true
    write_paths:
      - strategies/chatgpt/
      - history/chatgpt/
      - docs/data/chatgpt.json
      - docs/data/chatgpt-history.json
    may_read_other_strategy: true

  claude:
    read_all: true
    write_paths:
      - strategies/claude/
      - history/claude/
      - data/claude/
      - docs/data/claude.json
      - docs/claude.html
    may_read_other_strategy: true

  automation:
    read: true
    write_generated_market_data: true
    write_generated_dashboard_data: true

forbidden_data:
  - surname
  - given_name
  - email
  - postal_address
  - phone
  - birth_date_full
  - contract_number
  - client_identifier
  - beneficiary_clause
  - raw_contract_document

allowed_identity:
  alias: Bernard

portfolio_representation:
  exact_euro_amounts_in_repository: true
  exact_value_on_public_page: true
  condition: >-
    Les montants peuvent être publiés car ils ne permettent pas d'identifier
    Bernard. Aucun nom, prénom, date de naissance, adresse, numéro de contrat
    ou autre identifiant personnel ne doit apparaître.
  percentages: true
