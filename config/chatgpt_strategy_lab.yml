strategies:
  risk_budget:
    label: "ChatGPT D — Budget de risque"
    review: "Mensuelle"
    purpose: "Répartir une même poche entre actifs peu ou très instables, au lieu de donner le même poids à chacun."
    rule: "À chaque revue, le poids de chaque actif est inversement proportionnel à sa volatilité observée sur 60 séances. Aucun actif ne dépasse 40 % de la poche."
    assets:
      - FR0010315770
      - LU0290357846
      - LU0478205379
      - LU2611731824
  macro_regime:
    label: "ChatGPT E — Régime macro-financier"
    review: "Hebdomadaire, après la dernière publication disponible"
    purpose: "Réduire la part actions lorsque plusieurs données externes signalent un contexte financier tendu."
    rule: "Prudence si au moins deux conditions sont vraies : NFCI positif ; incertitude économique au-dessus de son 75e percentile sur un an ; dollar large en hausse de plus de 3 % sur 60 séances. Sinon allocation normale."
    normal_assets:
      FR0010315770: 0.60
      LU0290357846: 0.20
      LU2611731824: 0.20
    cautious_assets:
      FR0010315770: 0.25
      LU2533811910: 0.50
      LU0290358497: 0.25
  volume_confirmation:
    label: "ChatGPT F — Tendance confirmée par le volume"
    review: "Hebdomadaire"
    purpose: "Ne retenir que des ETF dont la tendance et l'activité de cotation vont dans le même sens."
    rule: "Parmi les ETF avec volume fiable, retenir au plus cinq supports : prix au-dessus de la moyenne 200 séances, hausse sur 60 séances et volume du dernier jour au moins 1,3 fois sa moyenne des 20 séances. À défaut, la poche reste sur le support monétaire."
    top_n: 5
    volume_ratio_min: 1.3
    defensive_asset: LU0290358497
