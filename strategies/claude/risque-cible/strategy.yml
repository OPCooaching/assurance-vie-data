id: claude-risque-cible
label: "Claude B — Risque cible constant"
status: research_hypothesis
active_version: v0.2
decision_frequency: weekly
execution_model: next_available_valuation
history_mode: append_only

summary: >
  La part actions n'est pas fixée d'avance : elle est calculée chaque semaine
  pour viser un niveau de risque constant, et se réduit quand le marché
  s'agite.

objective: >
  Maintenir constant le risque du contrat plutôt que sa répartition. La part
  actions monte quand les marchés sont calmes et baisse quand ils s'agitent.

main_rule: >
  Part actions égale à la volatilité cible divisée par la volatilité réalisée
  de la poche actions, bornée entre vingt et soixante pour cent. Recalculée
  chaque semaine, appliquée seulement si l'écart dépasse cinq points. La
  composition de cette poche actions est celle de Claude A.

main_rule_scope: >
  Ce texte décrit la version active, la v0.2, qui mesure la volatilité réalisée
  sur quarante séances. La v0.1 la mesurait sur soixante séances ; ses
  paramètres restent en place et ne sont pas réécrits.

research_basis:
  - volatility_clustering
  - volatility_is_persistent_returns_are_not
  - volatility_targeting

parameters:
  v0.1:
    target_volatility_pct: 10
    realized_vol_window_days: 60
    equity_min_pct: 20
    equity_max_pct: 60
    action_threshold_pct: 5
    composition: same_as_claude_socle_satellites
    max_arbitrages_per_month: 2

  v0.2:
    note: "Fenêtre de volatilité ramenée à 40 séances, faute de profondeur."
    realized_vol_window_days: 40
    target_volatility_pct: 10
    equity_min_pct: 20
    equity_max_pct: 60
    currency_universe: eur_quoted_only

constraints:
  - no_daily_trading
  - weekly_review_only
  - execution_price_unknown_at_order_time

known_weakness: >
  Réduit l'exposition après une hausse de volatilité, donc souvent après le
  début d'une baisse. Manque une partie des rebonds rapides.
