id: claude-double-filtre
label: "Claude C — Tendance confirmée par l'ampleur"
status: research_hypothesis
active_version: v0.2
decision_frequency: weekly
execution_model: next_available_valuation
history_mode: append_only

summary: >
  L'exposition ne passe au maximum que si l'indice monde et la majorité des
  supports suivis montent ensemble ; une seule des deux conditions donne une
  demi-exposition, aucune des deux renvoie au support monétaire.

objective: >
  N'être pleinement exposé que lorsque la tendance est confirmée par un nombre
  suffisant de supports, et non par un seul indice.

main_rule: >
  Indice monde au-dessus de sa moyenne mobile et plus de la moitié des supports
  suivis au-dessus de la leur, exposition pleine. Une seule des deux conditions
  remplie, moitié de l'exposition. Aucune des deux, tout sur le support
  monétaire.

main_rule_scope: >
  Ce texte décrit la version active, la v0.2, qui utilise une moyenne 100 jours
  et trois thèmes, seuls supports disponibles en cotation euro. Le délai minimal
  de vingt séances entre deux changements d'état, prévu par la v0.1, n'est pas
  implémenté : le rétablir relève d'une version suivante, pas d'une retouche.
  Les paramètres de la v0.1 restent en place et ne sont pas réécrits.

research_basis:
  - market_breadth
  - trend_confirmation_reduces_false_signals

parameters:
  v0.1:
    equity_target_pct: 50
    breadth_universe: followed_themes_plus_core
    breadth_threshold_pct: 50
    trend_filter: sma_200
    partial_exposure_pct: 50
    evaluation_day: friday_close
    min_days_between_changes: 20

  v0.2:
    note: "Moyenne 100 jours et trois thèmes, seuls supports EUR disponibles."
    trend_filter: sma_100
    breadth_threshold_pct: 50
    equity_target_pct: 50
    currency_universe: eur_quoted_only

constraints:
  - no_daily_trading
  - weekly_review_only
  - execution_price_unknown_at_order_time

known_weakness: >
  Trois états seulement. Les passages d'un état à l'autre sont brutaux et
  peuvent se produire près d'un point de retournement.
