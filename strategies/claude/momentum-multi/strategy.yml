id: claude-momentum-multi
label: "Claude D — Momentum multi-horizon"
status: research_witness
tracking_start: 2026-09-09
courbe_interrompue_du: 2026-09-18
courbe_reprise_le: 2026-09-30
tracking_note: >
  Archive de recherche. La courbe est recalculée chaque jour depuis le
  9 septembre 2026, avec un trou du 18 au 30 septembre laissé explicite.
  Aucune décision hebdomadaire n'est encore enregistrée dans history/claude/.
tracking_note: >
  Suivi engagé le 9 septembre 2026. Interrompu depuis le 18 septembre : l'étape
  de calcul quotidien a été retirée du workflow le 22 septembre et n'a pas été
  rétablie. Aucune décision n'est prise depuis cette date.
active_version: v0.2
decision_frequency: weekly
execution_model: next_available_valuation
history_mode: append_only

summary: >
  Chaque semaine, les six supports qui progressent le plus sur les six et douze
  derniers mois sont détenus à parts égales ; un support qui recule sur ces deux
  horizons n'est pas détenu et sa part attend sur le support monétaire.

objective: >
  Utiliser l'ensemble des supports cotés en euros accessibles dans le contrat,
  et non une liste de thèmes choisie d'avance, en laissant le classement décider
  de la composition.

main_rule: >
  Chaque vendredi, chaque support de l'univers reçoit un score égal à la moyenne
  de sa performance sur cent vingt-six séances et sur deux cent cinquante-deux
  séances. Les six meilleurs scores strictement positifs sont détenus à parts
  égales, pour la moitié du contrat. Chaque place non pourvue reste sur le
  support monétaire. L'autre moitié du contrat reste en fonds en euros.

main_rule_scope: >
  Ce texte décrit la version active, la v0.1.

research_basis:
  - cross_sectional_momentum
  - time_series_momentum_absolute_filter
  - equal_weight_beats_concentrated_bets

parameters:
  v0.1:
    equity_target_pct: 50
    selection: cross_sectional_momentum
    lookbacks_sessions: [126, 252]
    top_k: 6
    weighting: equal
    absolute_filter: score_strictly_positive
    trend_filter: null
    market_guard: false
    rebalance_band_pct: 3
    currency_universe: eur_quoted_only
    universe: all_eur_quoted_funds

  v0.2:
    note: >
      Seul le calendrier change par rapport à la v0.1. La revue passe du
      lundi au vendredi : elle se calcule sur la dernière valorisation de la
      semaine et s'applique à la valorisation suivante, donc au lundi. C'est la
      convention du protocole commun du 23 septembre 2026, et elle permet à
      Bernard de voir dès le dimanche l'allocation retenue pour la semaine qui
      vient. Aucun seuil, aucune fenêtre, aucun univers n'est modifié : les
      paramètres de la v0.1 restent en vigueur et ne sont pas réécrits.
    review_day: friday
    applies_on: next_available_valuation
    changed_on: 2026-10-04

constraints:
  - no_daily_trading
  - weekly_review_only
  - execution_price_unknown_at_order_time
  - free_arbitrages_do_not_justify_churn

known_weakness: >
  Le classement peut retenir deux supports très proches, par exemple deux ETF
  sur le même indice, ce qui concentre le risque sans que la règle s'en aperçoive.
  La stratégie subit aussi les retournements brutaux : un support acheté après
  une forte hausse est vendu après le début de la baisse.
